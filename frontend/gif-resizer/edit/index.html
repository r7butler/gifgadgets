<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Resizer — GifWidgets</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0c14" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
  <style>
    .gr-app { display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden; }
    .gr-body { display:flex;flex:1;overflow:hidden; }
    .gr-preview { flex:1;display:flex;flex-direction:column;background:#000;overflow:hidden;min-width:0; }
    .gr-preview-stage { flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px; }
    .gr-preview-stage canvas { max-width:100%;max-height:100%;display:block; }
    .gr-sidebar { width:280px;min-width:280px;background:var(--bg-secondary);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column; }
    .gr-section { padding:12px;border-bottom:1px solid var(--border); }
    .gr-section-title { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:10px; }
    .gr-upload-zone { flex:1;display:flex;align-items:center;justify-content:center;padding:2rem; }
    .gr-drop-zone { width:100%;max-width:500px;background:var(--bg-secondary);border:2px dashed var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s; }
    .gr-drop-zone:hover,.gr-drop-zone.dragover { border-color:var(--cat-gif);background:var(--cat-gif-dim); }
    .gr-resize-btn { width:100%;padding:12px;background:var(--cat-gif);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:8px; }
    .gr-resize-btn:disabled { opacity:.4;cursor:not-allowed; }
    .gr-resize-btn:hover:not(:disabled) { opacity:.9; }
    .gr-size-input { width:80px;padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;text-align:center; }
    .gr-size-row { display:flex;align-items:center;gap:8px;margin-bottom:10px; }
    .gr-size-label { font-size:13px;color:var(--text-secondary);min-width:50px; }
    .gr-size-info { font-size:12px;color:var(--text-muted);margin-top:6px; }
    .gr-lock-btn { background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;display:flex; }
    .gr-result-modal { max-width:480px; }
    .gr-result-preview { display:flex;justify-content:center;align-items:center;padding:12px;margin-bottom:1rem;border-radius:10px;background:var(--bg-base);overflow:hidden; }
    .gr-result-preview img { max-width:100%;max-height:280px;display:block;border-radius:8px;box-shadow:var(--shadow-md); }
    .gr-result-info { font-size:13px;color:var(--text-secondary);text-align:center;margin-bottom:1rem; }
    .gr-result-actions { display:flex;flex-direction:column;align-items:center;gap:10px; }
    .gr-dl-btn { display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-md);background:var(--cat-gif);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s; }
    .gr-dl-btn:hover { opacity:.9; }
    .gr-save-photos-link { background:none;border:none;color:var(--text-secondary);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px; }
    .gr-save-photos-link:hover { color:var(--text-primary); }
    @media (max-width: 768px) {
      .gr-body { flex-direction:column; }
      .gr-preview { min-height:200px;min-width:0; }
      .gr-sidebar { width:100%;min-width:0;max-height:45vh;border-left:none;border-top:1px solid var(--border); }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-STTEFW2R1M"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-STTEFW2R1M');</script>
</head>
<body class="editor-body">
<div class="gr-app" id="app">
  <header class="editor-header">
    <a href="/gif-resizer/" class="logo">Gif<span class="logo-accent">Widgets</span></a>
    <div class="header-actions">
      <button id="btn-new" class="btn btn-ghost" aria-label="Load new GIF" title="Load a different GIF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        New
      </button>
      <button id="btn-download" class="btn btn-ghost" disabled aria-label="Download GIF" title="Download GIF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
    </div>
  </header>

  <div id="loading-overlay" class="overlay hidden">
    <div class="overlay-content">
      <p class="progress-text" id="loading-text">Processing…</p>
      <div class="progress-bar" style="margin-top:12px"><div class="progress-bar-fill" id="progress-fill" style="background:var(--cat-gif)"></div></div>
    </div>
  </div>

  <!-- Upload screen -->
  <div id="upload-screen" class="gr-body" style="flex-direction:column;justify-content:center;align-items:center">
    <div class="gr-upload-zone" style="width:100%">
      <div class="gr-drop-zone" id="drop-zone">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="color:var(--text-muted);margin-bottom:1rem"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        <h2>Drop a GIF here</h2>
        <p style="color:var(--text-secondary)">or click to browse</p>
        <input type="file" id="file-input" accept="image/gif,.gif" hidden />
      </div>
    </div>
  </div>

  <!-- Editor workspace -->
  <div id="editor-screen" class="gr-body hidden">
    <div class="gr-preview" id="preview-area">
      <div class="gr-preview-stage">
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="playback-controls">
        <button id="btn-prev-frame" class="ctrl-btn" title="Previous frame" aria-label="Previous frame">&laquo;</button>
        <button id="btn-play-pause" class="ctrl-btn ctrl-btn-play" title="Play / Pause" aria-label="Play or pause">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btn-next-frame" class="ctrl-btn" title="Next frame" aria-label="Next frame">&raquo;</button>
        <span id="frame-counter" class="frame-counter">0 / 0</span>
      </div>
    </div>
    <div class="gr-sidebar">
      <div class="gr-section">
        <div class="gr-section-title">Original Size</div>
        <p id="original-size" style="font-size:13px;color:var(--text-secondary);margin:0">–</p>
      </div>
      <div class="gr-section">
        <div class="gr-section-title">New Size</div>
        <div class="gr-size-row">
          <span class="gr-size-label">Width</span>
          <input type="number" id="inp-width" class="gr-size-input" min="1" />
          <span style="color:var(--text-muted)">px</span>
        </div>
        <div class="gr-size-row">
          <span class="gr-size-label">Height</span>
          <input type="number" id="inp-height" class="gr-size-input" min="1" />
          <span style="color:var(--text-muted)">px</span>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin-bottom:8px">
          <input type="checkbox" id="chk-lock" checked style="accent-color:var(--cat-gif)" />
          Lock aspect ratio
        </label>
        <p class="gr-size-info" id="size-info"></p>
      </div>
      <div class="gr-section">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)">
          <input type="checkbox" id="chk-watermark" checked style="accent-color:var(--cat-gif)" />
          Include GifWidgets watermark
        </label>
      </div>
      <div class="gr-section">
        <button class="gr-resize-btn" id="btn-resize" disabled>Resize GIF</button>
      </div>
    </div>
  </div>
</div>

<!-- Result modal -->
<div id="result-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="GIF result">
  <div class="modal gr-result-modal">
    <button id="result-modal-close" class="modal-close" aria-label="Close">&times;</button>
    <h2 class="modal-title">Your resized GIF is ready</h2>
    <div class="gr-result-preview">
      <img id="result-gif" alt="Resized GIF" />
    </div>
    <p id="result-info" class="gr-result-info"></p>
    <div class="gr-result-actions">
      <button id="btn-dl-modal" class="gr-dl-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download GIF
      </button>
      <button id="btn-save-photos" class="gr-save-photos-link" type="button">Save to Photos</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/omggif@1.0.10/omggif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('preview-canvas');
  var ctx = canvas.getContext('2d');
  var inpWidth = document.getElementById('inp-width');
  var inpHeight = document.getElementById('inp-height');
  var chkLock = document.getElementById('chk-lock');
  var originalSizeEl = document.getElementById('original-size');
  var sizeInfoEl = document.getElementById('size-info');
  var resizeBtn = document.getElementById('btn-resize');
  var btnPrevFrame = document.getElementById('btn-prev-frame');
  var btnPlayPause = document.getElementById('btn-play-pause');
  var btnNextFrame = document.getElementById('btn-next-frame');
  var frameCounter = document.getElementById('frame-counter');
  var playIcon = document.getElementById('play-icon');
  var pauseIcon = document.getElementById('pause-icon');
  var loadingOverlay = document.getElementById('loading-overlay');
  var loadingText = document.getElementById('loading-text');
  var progressFill = document.getElementById('progress-fill');
  var resultModal = document.getElementById('result-modal');
  var resultGif = document.getElementById('result-gif');
  var resultInfo = document.getElementById('result-info');
  var dlBtn = document.getElementById('btn-dl-modal');
  var btnSavePhotos = document.getElementById('btn-save-photos');
  var dlBtnHeader = document.getElementById('btn-download');

  var frames = []; // { imageData, delay }
  var origWidth = 0, origHeight = 0;
  var currentFrame = 0;
  var isPlaying = false;
  var playTimer = null;
  var lastGifUrl = null;
  var lastGifBlob = null;
  var lastGifFilename = 'resized.gif';
  var gifFilename = 'gif';
  var workerBlobUrl = null;

  fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
    .then(function(r){ return r.blob(); })
    .then(function(b){ workerBlobUrl = URL.createObjectURL(b); })
    .catch(function(){});

  var chkWatermark = document.getElementById('chk-watermark');

  function drawWatermark(ctx2d, w, h) {
    if (!chkWatermark.checked) return;
    var fontSize = Math.max(10, Math.round(w * 0.028));
    ctx2d.save();
    ctx2d.font = fontSize + 'px sans-serif';
    ctx2d.textAlign = 'right';
    ctx2d.textBaseline = 'bottom';
    ctx2d.globalAlpha = 0.35;
    ctx2d.fillStyle = '#ffffff';
    ctx2d.strokeStyle = '#000000';
    ctx2d.lineWidth = Math.max(1, fontSize * 0.15);
    ctx2d.strokeText('GifWidgets.com', w - 6, h - 4);
    ctx2d.fillText('GifWidgets.com', w - 6, h - 4);
    ctx2d.restore();
  }

  function formatSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
    return (b/1024/1024).toFixed(1) + ' MB';
  }

  // ── GIF decoding ──

  function decodeGif(buffer) {
    var reader = new GifReader(new Uint8Array(buffer));
    var w = reader.width, h = reader.height;
    var compCanvas = document.createElement('canvas');
    compCanvas.width = w; compCanvas.height = h;
    var compCtx = compCanvas.getContext('2d', { willReadFrequently: true });
    var tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = w; tmpCanvas.height = h;
    var tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });

    var decoded = [];
    var prevSnapshot = null;

    for (var i = 0; i < reader.numFrames(); i++) {
      var info = reader.frameInfo(i);
      var pixels = new Uint8ClampedArray(w * h * 4);
      reader.decodeAndBlitFrameRGBA(i, pixels);

      if (info.disposal === 3 && !prevSnapshot) {
        prevSnapshot = compCtx.getImageData(0, 0, w, h);
      }

      var frameImgData = new ImageData(pixels, w, h);
      tmpCtx.clearRect(0, 0, w, h);
      tmpCtx.putImageData(frameImgData, 0, 0);

      if (info.disposal === 2) {
        compCtx.clearRect(info.x, info.y, info.width, info.height);
      }

      compCtx.drawImage(tmpCanvas, 0, 0);
      decoded.push({
        imageData: compCtx.getImageData(0, 0, w, h),
        delay: Math.max((info.delay || 10) * 10, 20)
      });

      if (info.disposal === 2) {
        compCtx.clearRect(info.x, info.y, info.width, info.height);
      } else if (info.disposal === 3 && prevSnapshot) {
        compCtx.putImageData(prevSnapshot, 0, 0);
        prevSnapshot = null;
      }
    }

    return { width: w, height: h, frames: decoded };
  }

  // ── Load GIF ──

  function loadGif(file) {
    gifFilename = (file.name || 'gif').replace(/\.[^.]+$/, '');
    loadingOverlay.classList.remove('hidden');
    loadingText.textContent = 'Decoding GIF…';
    progressFill.style.width = '30%';

    var reader = new FileReader();
    reader.onload = function () {
      var result = decodeGif(reader.result);
      loadingOverlay.classList.add('hidden');

      origWidth = result.width;
      origHeight = result.height;
      frames = result.frames;
      currentFrame = 0;

      originalSizeEl.textContent = origWidth + ' × ' + origHeight + ' · ' + frames.length + ' frames';
      inpWidth.value = origWidth;
      inpHeight.value = origHeight;
      inpWidth.max = origWidth;
      inpHeight.max = origHeight;
      updateSizeInfo();

      document.getElementById('upload-screen').classList.add('hidden');
      document.getElementById('editor-screen').classList.remove('hidden');
      resizeBtn.disabled = false;

      updatePreview();
      updateFrameCounter();
    };
    reader.readAsArrayBuffer(file);
  }

  // ── Preview ──

  function updatePreview() {
    if (!frames.length) return;
    var f = frames[currentFrame];
    canvas.width = origWidth;
    canvas.height = origHeight;
    ctx.putImageData(f.imageData, 0, 0);
  }

  function updateFrameCounter() {
    if (!frames.length) { frameCounter.textContent = '0 / 0'; return; }
    frameCounter.textContent = (currentFrame + 1) + ' / ' + frames.length;
  }

  // ── Playback ──

  function startPlayback() {
    if (frames.length < 2) return;
    isPlaying = true;
    playIcon.classList.add('hidden');
    pauseIcon.classList.remove('hidden');
    advanceFrame();
  }

  function stopPlayback() {
    isPlaying = false;
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  }

  function advanceFrame() {
    if (!isPlaying || frames.length < 2) { stopPlayback(); return; }
    var delay = frames[currentFrame].delay;
    currentFrame = (currentFrame + 1) % frames.length;
    updatePreview();
    updateFrameCounter();
    playTimer = setTimeout(advanceFrame, delay);
  }

  btnPlayPause.addEventListener('click', function () { if (isPlaying) stopPlayback(); else startPlayback(); });
  btnPrevFrame.addEventListener('click', function () { stopPlayback(); if (!frames.length) return; currentFrame = (currentFrame - 1 + frames.length) % frames.length; updatePreview(); updateFrameCounter(); });
  btnNextFrame.addEventListener('click', function () { stopPlayback(); if (!frames.length) return; currentFrame = (currentFrame + 1) % frames.length; updatePreview(); updateFrameCounter(); });

  // ── Size inputs ──

  function updateSizeInfo() {
    var w = parseInt(inpWidth.value, 10) || 0;
    var h = parseInt(inpHeight.value, 10) || 0;
    if (w > origWidth || h > origHeight) {
      sizeInfoEl.textContent = 'Cannot upscale beyond original size.';
      sizeInfoEl.style.color = 'var(--danger)';
    } else if (w < 1 || h < 1) {
      sizeInfoEl.textContent = '';
    } else {
      var ratio = (w * h) / (origWidth * origHeight);
      sizeInfoEl.textContent = 'Scale: ' + Math.round(ratio * 100) + '% of original';
      sizeInfoEl.style.color = 'var(--text-muted)';
    }
  }

  var updatingSize = false;
  inpWidth.addEventListener('input', function () {
    if (updatingSize) return;
    var w = parseInt(inpWidth.value, 10);
    if (chkLock.checked && w && origWidth) {
      updatingSize = true;
      inpHeight.value = Math.round((w / origWidth) * origHeight);
      updatingSize = false;
    }
    updateSizeInfo();
  });
  inpHeight.addEventListener('input', function () {
    if (updatingSize) return;
    var h = parseInt(inpHeight.value, 10);
    if (chkLock.checked && h && origHeight) {
      updatingSize = true;
      inpWidth.value = Math.round((h / origHeight) * origWidth);
      updatingSize = false;
    }
    updateSizeInfo();
  });

  // ── Resize ──

  function startResize() {
    var newW = parseInt(inpWidth.value, 10);
    var newH = parseInt(inpHeight.value, 10);
    if (!newW || !newH || newW < 1 || newH < 1) return;
    if (newW > origWidth || newH > origHeight) { alert('Cannot upscale beyond the original dimensions.'); return; }

    stopPlayback();
    resizeBtn.disabled = true;
    loadingOverlay.classList.remove('hidden');
    progressFill.style.width = '0%';
    loadingText.textContent = 'Resizing frames…';

    var srcCanvas = document.createElement('canvas');
    srcCanvas.width = origWidth; srcCanvas.height = origHeight;
    var srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
    var dstCanvas = document.createElement('canvas');
    dstCanvas.width = newW; dstCanvas.height = newH;
    var dstCtx = dstCanvas.getContext('2d', { willReadFrequently: true });

    var resizedFrames = [];
    for (var i = 0; i < frames.length; i++) {
      srcCtx.putImageData(frames[i].imageData, 0, 0);
      dstCtx.clearRect(0, 0, newW, newH);
      dstCtx.drawImage(srcCanvas, 0, 0, newW, newH);
      drawWatermark(dstCtx, newW, newH);
      resizedFrames.push({ imageData: dstCtx.getImageData(0, 0, newW, newH), delay: frames[i].delay });
      progressFill.style.width = ((i + 1) / frames.length * 40) + '%';
    }

    loadingText.textContent = 'Encoding GIF…';
    progressFill.style.width = '40%';

    var gifOptions = { workers: 2, quality: 10, width: newW, height: newH, repeat: 0 };
    if (workerBlobUrl) gifOptions.workerScript = workerBlobUrl;
    var gif = new GIF(gifOptions);
    resizedFrames.forEach(function (f) { gif.addFrame(f.imageData, { delay: f.delay, copy: true }); });

    gif.on('progress', function (p) {
      progressFill.style.width = (p * 60 + 40) + '%';
      loadingText.textContent = 'Encoding GIF… ' + Math.round(p * 60 + 40) + '%';
    });

    gif.on('finished', function (blob) {
      progressFill.style.width = '100%';
      loadingOverlay.classList.add('hidden');
      resizeBtn.disabled = false;

      if (lastGifUrl) URL.revokeObjectURL(lastGifUrl);
      var url = URL.createObjectURL(blob);
      lastGifUrl = url;
      lastGifBlob = blob;
      lastGifFilename = gifFilename + '-' + newW + 'x' + newH + '.gif';

      resultGif.src = url;
      resultInfo.textContent = resizedFrames.length + ' frames · ' + newW + '×' + newH + ' · ' + formatSize(blob.size);
      resultModal.classList.remove('hidden');
      dlBtnHeader.disabled = false;
    });

    gif.render();
  }

  resizeBtn.addEventListener('click', startResize);
  dlBtnHeader.addEventListener('click', function () { if (lastGifBlob) downloadGif(); else startResize(); });

  // ── Result modal ──

  function downloadGif() {
    if (!lastGifUrl) return;
    var a = document.createElement('a'); a.href = lastGifUrl; a.download = lastGifFilename; a.click();
  }
  function closeResultModal() { resultModal.classList.add('hidden'); }

  dlBtn.addEventListener('click', downloadGif);
  btnSavePhotos.addEventListener('click', function () {
    if (!lastGifBlob) return;
    var file = new File([lastGifBlob], lastGifFilename, { type: 'image/gif' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Resized GIF' }).catch(function () {});
    } else { downloadGif(); }
  });
  document.getElementById('result-modal-close').addEventListener('click', closeResultModal);
  resultModal.addEventListener('click', function (e) { if (e.target === resultModal) closeResultModal(); });

  // ── New ──

  document.getElementById('btn-new').addEventListener('click', function () {
    if (document.getElementById('editor-screen').classList.contains('hidden')) return;
    window.GWConfirmAction({
      title: 'Load a new GIF?',
      message: 'Your current GIF and any resized result will be lost.',
      confirmLabel: 'Start New',
      onConfirm: function () {
        stopPlayback();
        frames = []; currentFrame = 0;
        if (lastGifUrl) URL.revokeObjectURL(lastGifUrl);
        lastGifUrl = null; lastGifBlob = null;
        document.getElementById('editor-screen').classList.add('hidden');
        document.getElementById('upload-screen').classList.remove('hidden');
        resizeBtn.disabled = true; dlBtnHeader.disabled = true;
        resultModal.classList.add('hidden');
        frameCounter.textContent = '0 / 0';
      }
    });
  });

  // ── Upload ──

  var dropZone = document.getElementById('drop-zone');
  var fileInput = document.getElementById('file-input');
  dropZone.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { if (fileInput.files[0]) loadGif(fileInput.files[0]); });
  dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) loadGif(e.dataTransfer.files[0]); });

  // ── IndexedDB ──

  (function () {
    var req = indexedDB.open('gifcaption', 1);
    req.onupgradeneeded = function (e) { e.target.result.createObjectStore('files'); };
    req.onsuccess = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('files')) return;
      var tx = db.transaction('files', 'readonly');
      var get = tx.objectStore('files').get('pending');
      get.onsuccess = function () {
        var file = get.result;
        if (!file) return;
        db.transaction('files', 'readwrite').objectStore('files').delete('pending');
        if (file.type === 'image/gif' || (file.name && file.name.toLowerCase().endsWith('.gif'))) loadGif(file);
      };
    };
  })();

})();
</script>
</body>
