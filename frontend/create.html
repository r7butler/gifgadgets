<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload GIF — Add Captions to Your GIF | GifCaption</title>
  <meta name="description" content="Upload your GIF to start adding frame-perfect captions with GifCaption. Free online GIF caption maker — no signup, no watermark." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0c14" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Google AdSense (disabled until traffic increases)
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6040277278451227" crossorigin="anonymous"></script>
  -->
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNH9WX8YRK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PNH9WX8YRK');
  </script>
</head>
<body>
  <div class="container">
    <h1>Upload a GIF</h1>
    <a href="index.html">&larr; Back to home</a>

    <form id="upload-form">
      <label for="gif-file">Select a GIF file:</label>
      <input type="file" id="gif-file" accept="image/gif" required />
      <button type="submit" class="btn btn-primary">Upload &amp; Edit</button>
    </form>

    <div id="upload-result" class="result hidden">
      <p>GIF uploaded! Redirecting to editor…</p>
    </div>

    <div id="upload-error" class="error hidden">
      <p>Upload failed: <span id="error-message"></span></p>
    </div>

    <!-- Ad (disabled until traffic increases)
    <div class="ad-container ad-utility">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6040277278451227" data-ad-slot="6524012174" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    -->
  </div>
  <script src="app.js"></script>
  <!-- <script src="cookie-consent.js"></script> -->
  <script>
    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("gif-file");
      const file = fileInput.files[0];
      if (!file) return;

      try {
        const result = await uploadGif(file);
        document.getElementById("upload-result").classList.remove("hidden");
        document.getElementById("upload-error").classList.add("hidden");
        // Redirect to editor with the uploaded GIF
        window.location.href = "editor.html?id=" + encodeURIComponent(result.id);
      } catch (err) {
        document.getElementById("error-message").textContent = err.message;
        document.getElementById("upload-error").classList.remove("hidden");
        document.getElementById("upload-result").classList.add("hidden");
      }
    });
  </script>
</body>
</html>
