<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload GIF - GifCaption</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Upload a GIF</h1>
    <a href="index.html">&larr; Back to home</a>

    <form id="upload-form">
      <label for="gif-file">Select a GIF file:</label>
      <input type="file" id="gif-file" accept="image/gif" required />
      <button type="submit" class="btn">Upload</button>
    </form>

    <div id="upload-result" class="result hidden">
      <p>GIF uploaded successfully!</p>
      <p>ID: <span id="gif-id"></span></p>
      <a id="gif-link" href="#">View your GIF &rarr;</a>
    </div>

    <div id="upload-error" class="error hidden">
      <p>Upload failed: <span id="error-message"></span></p>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("gif-file");
      const file = fileInput.files[0];
      if (!file) return;

      try {
        const result = await uploadGif(file);
        document.getElementById("gif-id").textContent = result.id;
        document.getElementById("gif-link").href = "gif.html?id=" + encodeURIComponent(result.id);
        document.getElementById("upload-result").classList.remove("hidden");
        document.getElementById("upload-error").classList.add("hidden");
      } catch (err) {
        document.getElementById("error-message").textContent = err.message;
        document.getElementById("upload-error").classList.remove("hidden");
        document.getElementById("upload-result").classList.add("hidden");
      }
    });
  </script>
</body>
</html>
