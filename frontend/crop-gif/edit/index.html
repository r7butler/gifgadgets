<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop GIF — GifWidgets</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0c14" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
  <style>
    .gc-app { display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden; }
    .gc-body { display:flex;flex:1;overflow:hidden; }
    .gc-preview { flex:1;display:flex;flex-direction:column;background:#000;overflow:hidden;min-width:0; }
    .gc-preview-stage { flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px;position:relative; }
    .gc-canvas-wrap { position:relative;display:inline-block;max-width:100%;max-height:100%; }
    .gc-canvas-wrap canvas { display:block;max-width:100%;max-height:100%; }
    .gc-crop-overlay {
      position:absolute;top:0;left:0;width:100%;height:100%;
      cursor:crosshair;touch-action:none;
    }
    .gc-sidebar { width:280px;min-width:280px;background:var(--bg-secondary);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column; }
    .gc-section { padding:12px;border-bottom:1px solid var(--border); }
    .gc-section-title { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:10px; }
    .gc-upload-zone { flex:1;display:flex;align-items:center;justify-content:center;padding:2rem; }
    .gc-drop-zone { width:100%;max-width:500px;background:var(--bg-secondary);border:2px dashed var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s; }
    .gc-drop-zone:hover,.gc-drop-zone.dragover { border-color:var(--cat-gif);background:var(--cat-gif-dim); }
    .gc-crop-btn { width:100%;padding:12px;background:var(--cat-gif);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:8px; }
    .gc-crop-btn:disabled { opacity:.4;cursor:not-allowed; }
    .gc-crop-btn:hover:not(:disabled) { opacity:.9; }
    .gc-size-input { width:70px;padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;text-align:center; }
    .gc-size-row { display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--text-secondary); }
    .gc-reset-btn { background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:12px;padding:4px 10px;cursor:pointer;margin-top:4px; }
    .gc-reset-btn:hover { border-color:var(--cat-gif);color:var(--text-primary); }
    .gc-result-modal { max-width:480px; }
    .gc-result-preview { display:flex;justify-content:center;align-items:center;padding:12px;margin-bottom:1rem;border-radius:10px;background:var(--bg-base);overflow:hidden; }
    .gc-result-preview img { max-width:100%;max-height:280px;display:block;border-radius:8px;box-shadow:var(--shadow-md); }
    .gc-result-info { font-size:13px;color:var(--text-secondary);text-align:center;margin-bottom:1rem; }
    .gc-result-actions { display:flex;flex-direction:column;align-items:center;gap:10px; }
    .gc-dl-btn { display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-md);background:var(--cat-gif);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s; }
    .gc-dl-btn:hover { opacity:.9; }
    .gc-save-photos-link { background:none;border:none;color:var(--text-secondary);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px; }
    .gc-save-photos-link:hover { color:var(--text-primary); }
    @media (max-width: 768px) {
      .gc-body { flex-direction:column; }
      .gc-preview { min-height:200px;min-width:0; }
      .gc-sidebar { width:100%;min-width:0;max-height:45vh;border-left:none;border-top:1px solid var(--border); }
    }
  </style>

<body class="editor-body">
<div class="gc-app" id="app">
  <header class="editor-header">
    <a href="/crop-gif/" class="logo">Gif<span class="logo-accent">Widgets</span></a>
    <div class="header-actions">
      <button id="btn-new" class="btn btn-ghost" aria-label="Load new GIF" title="Load a different GIF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        New
      </button>
      <button id="btn-download" class="btn btn-ghost" disabled aria-label="Download GIF" title="Download GIF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
    </div>
  </header>

  <div id="loading-overlay" class="overlay hidden">
    <div class="overlay-content">
      <p class="progress-text" id="loading-text">Processing…</p>
      <div class="progress-bar" style="margin-top:12px"><div class="progress-bar-fill" id="progress-fill" style="background:var(--cat-gif)"></div></div>
    </div>
  </div>

  <!-- Upload screen -->
  <div id="upload-screen" class="gc-body" style="flex-direction:column;justify-content:center;align-items:center">
    <div class="gc-upload-zone" style="width:100%">
      <div class="gc-drop-zone" id="drop-zone">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="color:var(--text-muted);margin-bottom:1rem"><path d="M6 2v4"/><path d="M18 18v4"/><path d="M2 6h4"/><path d="M18 18h4"/><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        <h2>Drop a GIF here</h2>
        <p style="color:var(--text-secondary)">or click to browse</p>
        <input type="file" id="file-input" accept="image/gif,.gif" hidden />
      </div>
    </div>
  </div>

  <!-- Editor workspace -->
  <div id="editor-screen" class="gc-body hidden">
    <div class="gc-preview" id="preview-area">
      <div class="gc-preview-stage">
        <div class="gc-canvas-wrap" id="canvas-wrap">
          <canvas id="preview-canvas"></canvas>
          <canvas id="crop-overlay" class="gc-crop-overlay"></canvas>
        </div>
      </div>
      <div class="playback-controls">
        <button id="btn-prev-frame" class="ctrl-btn" title="Previous frame" aria-label="Previous frame">&laquo;</button>
        <button id="btn-play-pause" class="ctrl-btn ctrl-btn-play" title="Play / Pause" aria-label="Play or pause">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btn-next-frame" class="ctrl-btn" title="Next frame" aria-label="Next frame">&raquo;</button>
        <span id="frame-counter" class="frame-counter">0 / 0</span>
      </div>
    </div>
    <div class="gc-sidebar">
      <div class="gc-section">
        <div class="gc-section-title">Original Size</div>
        <p id="original-size" style="font-size:13px;color:var(--text-secondary);margin:0">–</p>
      </div>
      <div class="gc-section">
        <div class="gc-section-title">Crop Region</div>
        <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px">Drag on the preview to draw a crop area, or enter values below.</p>
        <div class="gc-size-row">
          <span style="min-width:18px">X</span>
          <input type="number" id="inp-x" class="gc-size-input" min="0" value="0" />
          <span style="min-width:18px">Y</span>
          <input type="number" id="inp-y" class="gc-size-input" min="0" value="0" />
        </div>
        <div class="gc-size-row">
          <span style="min-width:18px">W</span>
          <input type="number" id="inp-w" class="gc-size-input" min="1" />
          <span style="min-width:18px">H</span>
          <input type="number" id="inp-h" class="gc-size-input" min="1" />
        </div>
        <button class="gc-reset-btn" id="btn-reset-crop">Reset to full size</button>
      </div>
      <div class="gc-section">
        <button class="gc-crop-btn" id="btn-crop" disabled>Crop GIF</button>
      </div>
    </div>
  </div>
</div>

<!-- Result modal -->
<div id="result-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="GIF result">
  <div class="modal gc-result-modal">
    <button id="result-modal-close" class="modal-close" aria-label="Close">&times;</button>
    <h2 class="modal-title">Your cropped GIF is ready</h2>
    <div class="gc-result-preview">
      <img id="result-gif" alt="Cropped GIF" />
    </div>
    <p id="result-info" class="gc-result-info"></p>
    <div class="gc-result-actions">
      <button id="btn-dl-modal" class="gc-dl-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download GIF
      </button>
      <button id="btn-save-photos" class="gc-save-photos-link" type="button">Save to Photos</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/omggif@1.0.10/omggif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';

  var previewCanvas = document.getElementById('preview-canvas');
  var previewCtx = previewCanvas.getContext('2d');
  var cropCanvas = document.getElementById('crop-overlay');
  var cropCtx = cropCanvas.getContext('2d');
  var canvasWrap = document.getElementById('canvas-wrap');
  var inpX = document.getElementById('inp-x');
  var inpY = document.getElementById('inp-y');
  var inpW = document.getElementById('inp-w');
  var inpH = document.getElementById('inp-h');
  var originalSizeEl = document.getElementById('original-size');
  var cropBtn = document.getElementById('btn-crop');
  var btnPrevFrame = document.getElementById('btn-prev-frame');
  var btnPlayPause = document.getElementById('btn-play-pause');
  var btnNextFrame = document.getElementById('btn-next-frame');
  var frameCounter = document.getElementById('frame-counter');
  var playIcon = document.getElementById('play-icon');
  var pauseIcon = document.getElementById('pause-icon');
  var loadingOverlay = document.getElementById('loading-overlay');
  var loadingText = document.getElementById('loading-text');
  var progressFill = document.getElementById('progress-fill');
  var resultModal = document.getElementById('result-modal');
  var resultGif = document.getElementById('result-gif');
  var resultInfo = document.getElementById('result-info');
  var dlBtn = document.getElementById('btn-dl-modal');
  var btnSavePhotos = document.getElementById('btn-save-photos');
  var dlBtnHeader = document.getElementById('btn-download');

  var frames = [];
  var origWidth = 0, origHeight = 0;
  var currentFrame = 0;
  var isPlaying = false;
  var playTimer = null;
  var lastGifUrl = null;
  var lastGifBlob = null;
  var lastGifFilename = 'cropped.gif';
  var gifFilename = 'gif';
  var workerBlobUrl = null;

  // Crop state (in image coordinates)
  var crop = { x: 0, y: 0, w: 0, h: 0 };
  var dragState = null; // { startX, startY } in image coords

  fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
    .then(function(r){ return r.blob(); })
    .then(function(b){ workerBlobUrl = URL.createObjectURL(b); })
    .catch(function(){});

  function formatSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
    return (b/1024/1024).toFixed(1) + ' MB';
  }

  // ── GIF decoding ──

  function decodeGif(buffer) {
    var reader = new GifReader(new Uint8Array(buffer));
    var w = reader.width, h = reader.height;
    var compCanvas = document.createElement('canvas');
    compCanvas.width = w; compCanvas.height = h;
    var compCtx = compCanvas.getContext('2d', { willReadFrequently: true });
    var tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = w; tmpCanvas.height = h;
    var tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });

    var decoded = [];
    var prevSnapshot = null;

    for (var i = 0; i < reader.numFrames(); i++) {
      var info = reader.frameInfo(i);
      var pixels = new Uint8ClampedArray(w * h * 4);
      reader.decodeAndBlitFrameRGBA(i, pixels);

      if (info.disposal === 3 && !prevSnapshot) {
        prevSnapshot = compCtx.getImageData(0, 0, w, h);
      }

      var frameImgData = new ImageData(pixels, w, h);
      tmpCtx.clearRect(0, 0, w, h);
      tmpCtx.putImageData(frameImgData, 0, 0);

      if (info.disposal === 2) {
        compCtx.clearRect(info.x, info.y, info.width, info.height);
      }

      compCtx.drawImage(tmpCanvas, 0, 0);
      decoded.push({
        imageData: compCtx.getImageData(0, 0, w, h),
        delay: Math.max((info.delay || 10) * 10, 20)
      });

      if (info.disposal === 2) {
        compCtx.clearRect(info.x, info.y, info.width, info.height);
      } else if (info.disposal === 3 && prevSnapshot) {
        compCtx.putImageData(prevSnapshot, 0, 0);
        prevSnapshot = null;
      }
    }
    return { width: w, height: h, frames: decoded };
  }

  // ── Load GIF ──

  function loadGif(file) {
    gifFilename = (file.name || 'gif').replace(/\.[^.]+$/, '');
    loadingOverlay.classList.remove('hidden');
    loadingText.textContent = 'Decoding GIF…';
    progressFill.style.width = '30%';

    var reader = new FileReader();
    reader.onload = function () {
      var result = decodeGif(reader.result);
      loadingOverlay.classList.add('hidden');

      origWidth = result.width;
      origHeight = result.height;
      frames = result.frames;
      currentFrame = 0;

      originalSizeEl.textContent = origWidth + ' × ' + origHeight + ' · ' + frames.length + ' frames';
      crop = { x: 0, y: 0, w: origWidth, h: origHeight };
      updateCropInputs();

      document.getElementById('upload-screen').classList.add('hidden');
      document.getElementById('editor-screen').classList.remove('hidden');
      cropBtn.disabled = false;

      updatePreview();
      updateFrameCounter();
      drawCropOverlay();
    };
    reader.readAsArrayBuffer(file);
  }

  // ── Preview ──

  function updatePreview() {
    if (!frames.length) return;
    previewCanvas.width = origWidth;
    previewCanvas.height = origHeight;
    previewCtx.putImageData(frames[currentFrame].imageData, 0, 0);
    syncOverlaySize();
    drawCropOverlay();
  }

  function syncOverlaySize() {
    cropCanvas.width = previewCanvas.clientWidth;
    cropCanvas.height = previewCanvas.clientHeight;
    cropCanvas.style.width = previewCanvas.clientWidth + 'px';
    cropCanvas.style.height = previewCanvas.clientHeight + 'px';
  }

  function updateFrameCounter() {
    if (!frames.length) { frameCounter.textContent = '0 / 0'; return; }
    frameCounter.textContent = (currentFrame + 1) + ' / ' + frames.length;
  }

  // ── Crop overlay drawing ──

  function drawCropOverlay() {
    if (!origWidth) return;
    syncOverlaySize();
    var cw = cropCanvas.width, ch = cropCanvas.height;
    var sx = cw / origWidth, sy = ch / origHeight;

    cropCtx.clearRect(0, 0, cw, ch);

    // Darken outside crop
    cropCtx.fillStyle = 'rgba(0,0,0,0.55)';
    cropCtx.fillRect(0, 0, cw, ch);

    // Clear crop region
    var rx = crop.x * sx, ry = crop.y * sy, rw = crop.w * sx, rh = crop.h * sy;
    cropCtx.clearRect(rx, ry, rw, rh);

    // Draw border
    cropCtx.strokeStyle = '#fff';
    cropCtx.lineWidth = 2;
    cropCtx.strokeRect(rx, ry, rw, rh);

    // Draw rule-of-thirds lines
    cropCtx.strokeStyle = 'rgba(255,255,255,0.3)';
    cropCtx.lineWidth = 1;
    for (var i = 1; i <= 2; i++) {
      cropCtx.beginPath();
      cropCtx.moveTo(rx + rw * i / 3, ry);
      cropCtx.lineTo(rx + rw * i / 3, ry + rh);
      cropCtx.stroke();
      cropCtx.beginPath();
      cropCtx.moveTo(rx, ry + rh * i / 3);
      cropCtx.lineTo(rx + rw, ry + rh * i / 3);
      cropCtx.stroke();
    }

    // Corner handles
    var hs = 8;
    cropCtx.fillStyle = '#fff';
    [[rx, ry], [rx + rw, ry], [rx, ry + rh], [rx + rw, ry + rh]].forEach(function (p) {
      cropCtx.fillRect(p[0] - hs/2, p[1] - hs/2, hs, hs);
    });
  }

  // ── Crop interaction ──

  function screenToImage(clientX, clientY) {
    var rect = cropCanvas.getBoundingClientRect();
    var x = (clientX - rect.left) / rect.width * origWidth;
    var y = (clientY - rect.top) / rect.height * origHeight;
    return { x: Math.round(Math.max(0, Math.min(x, origWidth))), y: Math.round(Math.max(0, Math.min(y, origHeight))) };
  }

  cropCanvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    cropCanvas.setPointerCapture(e.pointerId);
    var pt = screenToImage(e.clientX, e.clientY);
    dragState = { startX: pt.x, startY: pt.y };
  });

  cropCanvas.addEventListener('pointermove', function (e) {
    if (!dragState) return;
    var pt = screenToImage(e.clientX, e.clientY);
    var x1 = Math.min(dragState.startX, pt.x);
    var y1 = Math.min(dragState.startY, pt.y);
    var x2 = Math.max(dragState.startX, pt.x);
    var y2 = Math.max(dragState.startY, pt.y);
    crop.x = x1; crop.y = y1;
    crop.w = Math.max(1, x2 - x1);
    crop.h = Math.max(1, y2 - y1);
    updateCropInputs();
    drawCropOverlay();
  });

  cropCanvas.addEventListener('pointerup', function () { dragState = null; });
  cropCanvas.addEventListener('pointercancel', function () { dragState = null; });

  function updateCropInputs() {
    inpX.value = crop.x;
    inpY.value = crop.y;
    inpW.value = crop.w;
    inpH.value = crop.h;
  }

  function readCropInputs() {
    crop.x = Math.max(0, Math.min(parseInt(inpX.value, 10) || 0, origWidth - 1));
    crop.y = Math.max(0, Math.min(parseInt(inpY.value, 10) || 0, origHeight - 1));
    crop.w = Math.max(1, Math.min(parseInt(inpW.value, 10) || 1, origWidth - crop.x));
    crop.h = Math.max(1, Math.min(parseInt(inpH.value, 10) || 1, origHeight - crop.y));
    updateCropInputs();
    drawCropOverlay();
  }

  inpX.addEventListener('change', readCropInputs);
  inpY.addEventListener('change', readCropInputs);
  inpW.addEventListener('change', readCropInputs);
  inpH.addEventListener('change', readCropInputs);

  document.getElementById('btn-reset-crop').addEventListener('click', function () {
    crop = { x: 0, y: 0, w: origWidth, h: origHeight };
    updateCropInputs();
    drawCropOverlay();
  });

  // Redraw overlay on resize
  window.addEventListener('resize', function () { if (origWidth) drawCropOverlay(); });

  // ── Playback ──

  function startPlayback() {
    if (frames.length < 2) return;
    isPlaying = true;
    playIcon.classList.add('hidden');
    pauseIcon.classList.remove('hidden');
    advanceFrame();
  }

  function stopPlayback() {
    isPlaying = false;
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  }

  function advanceFrame() {
    if (!isPlaying || frames.length < 2) { stopPlayback(); return; }
    var delay = frames[currentFrame].delay;
    currentFrame = (currentFrame + 1) % frames.length;
    updatePreview();
    updateFrameCounter();
    playTimer = setTimeout(advanceFrame, delay);
  }

  btnPlayPause.addEventListener('click', function () { if (isPlaying) stopPlayback(); else startPlayback(); });
  btnPrevFrame.addEventListener('click', function () { stopPlayback(); if (!frames.length) return; currentFrame = (currentFrame - 1 + frames.length) % frames.length; updatePreview(); updateFrameCounter(); });
  btnNextFrame.addEventListener('click', function () { stopPlayback(); if (!frames.length) return; currentFrame = (currentFrame + 1) % frames.length; updatePreview(); updateFrameCounter(); });

  // ── Crop ──

  function startCrop() {
    if (!frames.length || crop.w < 1 || crop.h < 1) return;
    stopPlayback();
    cropBtn.disabled = true;
    loadingOverlay.classList.remove('hidden');
    progressFill.style.width = '0%';
    loadingText.textContent = 'Cropping frames…';

    var srcCanvas = document.createElement('canvas');
    srcCanvas.width = origWidth; srcCanvas.height = origHeight;
    var srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });

    var croppedFrames = [];
    for (var i = 0; i < frames.length; i++) {
      srcCtx.putImageData(frames[i].imageData, 0, 0);
      var cropped = srcCtx.getImageData(crop.x, crop.y, crop.w, crop.h);
      croppedFrames.push({ imageData: cropped, delay: frames[i].delay });
      progressFill.style.width = ((i + 1) / frames.length * 40) + '%';
    }

    loadingText.textContent = 'Encoding GIF…';
    progressFill.style.width = '40%';

    var gifOptions = { workers: 2, quality: 10, width: crop.w, height: crop.h, repeat: 0 };
    if (workerBlobUrl) gifOptions.workerScript = workerBlobUrl;
    var gif = new GIF(gifOptions);
    croppedFrames.forEach(function (f) { gif.addFrame(f.imageData, { delay: f.delay, copy: true }); });

    gif.on('progress', function (p) {
      progressFill.style.width = (p * 60 + 40) + '%';
      loadingText.textContent = 'Encoding GIF… ' + Math.round(p * 60 + 40) + '%';
    });

    gif.on('finished', function (blob) {
      progressFill.style.width = '100%';
      loadingOverlay.classList.add('hidden');
      cropBtn.disabled = false;

      if (lastGifUrl) URL.revokeObjectURL(lastGifUrl);
      var url = URL.createObjectURL(blob);
      lastGifUrl = url;
      lastGifBlob = blob;
      lastGifFilename = gifFilename + '-cropped.gif';

      resultGif.src = url;
      resultInfo.textContent = croppedFrames.length + ' frames · ' + crop.w + '×' + crop.h + ' · ' + formatSize(blob.size);
      resultModal.classList.remove('hidden');
      dlBtnHeader.disabled = false;
    });

    gif.render();
  }

  cropBtn.addEventListener('click', startCrop);
  dlBtnHeader.addEventListener('click', function () { if (lastGifBlob) downloadGif(); else startCrop(); });

  // ── Result modal ──

  function downloadGif() {
    if (!lastGifUrl) return;
    var a = document.createElement('a'); a.href = lastGifUrl; a.download = lastGifFilename; a.click();
  }
  function closeResultModal() { resultModal.classList.add('hidden'); }

  dlBtn.addEventListener('click', downloadGif);
  btnSavePhotos.addEventListener('click', function () {
    if (!lastGifBlob) return;
    var file = new File([lastGifBlob], lastGifFilename, { type: 'image/gif' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Cropped GIF' }).catch(function () {});
    } else { downloadGif(); }
  });
  document.getElementById('result-modal-close').addEventListener('click', closeResultModal);
  resultModal.addEventListener('click', function (e) { if (e.target === resultModal) closeResultModal(); });

  // ── New ──

  document.getElementById('btn-new').addEventListener('click', function () {
    if (document.getElementById('editor-screen').classList.contains('hidden')) return;
    window.GWConfirmAction({
      title: 'Load a new GIF?',
      message: 'Your current GIF and any cropped result will be lost.',
      confirmLabel: 'Start New',
      onConfirm: function () {
        stopPlayback();
        frames = []; currentFrame = 0;
        if (lastGifUrl) URL.revokeObjectURL(lastGifUrl);
        lastGifUrl = null; lastGifBlob = null;
        document.getElementById('editor-screen').classList.add('hidden');
        document.getElementById('upload-screen').classList.remove('hidden');
        cropBtn.disabled = true; dlBtnHeader.disabled = true;
        resultModal.classList.add('hidden');
        frameCounter.textContent = '0 / 0';
      }
    });
  });

  // ── Upload ──

  var dropZone = document.getElementById('drop-zone');
  var fileInput = document.getElementById('file-input');
  dropZone.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { if (fileInput.files[0]) loadGif(fileInput.files[0]); });
  dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) loadGif(e.dataTransfer.files[0]); });

  // ── IndexedDB ──

  (function () {
    var req = indexedDB.open('gifcaption', 1);
    req.onupgradeneeded = function (e) { e.target.result.createObjectStore('files'); };
    req.onsuccess = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('files')) return;
      var tx = db.transaction('files', 'readonly');
      var get = tx.objectStore('files').get('pending');
      get.onsuccess = function () {
        var file = get.result;
        if (!file) return;
        db.transaction('files', 'readwrite').objectStore('files').delete('pending');
        if (file.type === 'image/gif' || (file.name && file.name.toLowerCase().endsWith('.gif'))) loadGif(file);
      };
    };
  })();

})();
</script>
</body>
</html>
