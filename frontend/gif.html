<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Captioned GIF — GifCaption</title>
  <meta name="description" content="View a captioned GIF created with GifCaption. Open it in the editor to add more text overlays, adjust timing, or re-export." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0c14" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Google AdSense (disabled until traffic increases)
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6040277278451227" crossorigin="anonymous"></script>
  -->
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNH9WX8YRK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PNH9WX8YRK');
  </script>
</head>
<body>
  <div class="container">
    <h1>GIF Viewer</h1>
    <a href="index.html">&larr; Back to home</a>

    <div id="gif-container" class="hidden">
      <img id="gif-image" src="" alt="GIF" />
      <p>Created at: <span id="gif-created-at"></span></p>
      <p style="margin-top:1rem"><a id="edit-link" href="#" class="btn btn-primary">Open in Editor</a></p>
    </div>

    <div id="gif-loading">
      <p>Loading...</p>
    </div>

    <div id="gif-error" class="error hidden">
      <p>Error: <span id="error-message"></span></p>
    </div>

    <!-- Ad (disabled until traffic increases)
    <div class="ad-container ad-utility">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6040277278451227" data-ad-slot="6524012174" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    -->
  </div>
  <script src="app.js"></script>
  <!-- <script src="cookie-consent.js"></script> -->
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        document.getElementById("gif-loading").classList.add("hidden");
        document.getElementById("error-message").textContent = "No GIF ID provided.";
        document.getElementById("gif-error").classList.remove("hidden");
        return;
      }

      try {
        const data = await fetchGif(id);
        document.getElementById("gif-image").src = data.gif_url;
        document.getElementById("gif-created-at").textContent = data.created_at;
        document.getElementById("edit-link").href = "editor.html?id=" + encodeURIComponent(id);
        document.getElementById("gif-container").classList.remove("hidden");
        document.getElementById("gif-loading").classList.add("hidden");
      } catch (err) {
        document.getElementById("gif-loading").classList.add("hidden");
        document.getElementById("error-message").textContent = err.message;
        document.getElementById("gif-error").classList.remove("hidden");
      }
    })();
  </script>
</body>
</html>
