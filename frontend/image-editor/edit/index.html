<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Editor — GifWidgets</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0c14" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Additional image-editor-specific styles */
    .ie-section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted); padding: 10px 12px 6px;
    }
    .ie-section { padding: 8px 12px 12px; border-bottom: 1px solid var(--border); }
    .ie-filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .ie-filter-btn {
      padding: 7px 4px; font-size: 12px; font-weight: 600; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-secondary);
      cursor: pointer; transition: all .15s; text-align: center;
    }
    .ie-filter-btn:hover, .ie-filter-btn.active { background: var(--cat-image); color: #fff; border-color: var(--cat-image); }
    .ie-transform-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .ie-transform-btn {
      flex: 1; min-width: 0; padding: 7px 4px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-primary); color: var(--text-secondary); cursor: pointer;
      transition: all .15s; text-align: center;
    }
    .ie-transform-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .ie-resize-row { display: flex; gap: 8px; align-items: flex-end; }
    .ie-resize-row .form-group { flex: 1; margin: 0; }
    .ie-resize-row input[type="number"] {
      width: 100%; padding: 6px 8px; font-size: 13px;
      background: var(--bg-primary); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .ie-lock-btn {
      padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-primary); color: var(--text-secondary); cursor: pointer; font-size: 16px; line-height: 1;
    }
    .ie-lock-btn.locked { color: var(--cat-image); border-color: var(--cat-image); }
    .ie-export-row { display: flex; gap: 8px; }
    .ie-export-row select {
      flex: 1; padding: 7px 8px; font-size: 13px;
      background: var(--bg-primary); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .ie-upload-zone {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .ie-drop-zone {
      width: 100%; max-width: 500px;
      background: var(--bg-secondary); border: 2px dashed var(--border);
      border-radius: var(--radius-lg); padding: 3rem 2rem; text-align: center;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .ie-drop-zone:hover, .ie-drop-zone.dragover {
      border-color: var(--cat-image); background: var(--cat-image-dim);
    }
    .ie-drop-zone svg { color: var(--text-muted); margin-bottom: 1rem; }
    .ie-drop-zone h2 { font-size: 1.2rem; margin-bottom: .4rem; }
    .ie-drop-zone p { color: var(--text-secondary); font-size: .9rem; }
    .ie-reset-btn {
      padding: 5px 10px; font-size: 12px; background: none; border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer;
    }
    .ie-reset-btn:hover { color: var(--danger); border-color: var(--danger); }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNH9WX8YRK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PNH9WX8YRK');
  </script>
</head>
<body class="editor-body">

<div class="image-editor-app" id="app">

  <header class="image-editor-header">
    <a href="/image-editor/" class="logo">Gif<span class="logo-accent">Widgets</span> <span style="font-size:12px;font-weight:500;color:var(--text-muted);margin-left:6px">Image Editor</span></a>
    <div class="header-actions">
      <button id="btn-new" class="btn btn-ghost btn-small">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        New Image
      </button>
      <button id="btn-download" class="btn btn-primary btn-small" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
    </div>
  </header>

  <!-- Upload screen -->
  <div id="upload-screen" class="image-editor-workspace" style="flex-direction:column;justify-content:center;align-items:center">
    <div class="ie-upload-zone" style="width:100%">
      <div class="ie-drop-zone" id="drop-zone">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        <h2>Drop an image here</h2>
        <p>or click to browse</p>
        <p style="font-size:.8rem;color:var(--text-muted);margin-top:.4rem">Supports JPG, PNG, WebP, GIF</p>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" hidden />
      </div>
    </div>
  </div>

  <!-- Editor workspace (hidden until image loaded) -->
  <div id="editor-screen" class="image-editor-workspace hidden">
    <div class="image-editor-canvas-area" id="canvas-area">
      <canvas id="main-canvas"></canvas>
    </div>

    <div class="image-editor-sidebar">
      <div class="ie-section-label">Adjustments</div>
      <div class="ie-section">
        <div class="form-group" style="margin-bottom:10px">
          <label>Brightness: <span id="val-brightness">0</span></label>
          <input type="range" id="sl-brightness" min="-100" max="100" value="0" />
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label>Contrast: <span id="val-contrast">0</span></label>
          <input type="range" id="sl-contrast" min="-100" max="100" value="0" />
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label>Saturation: <span id="val-saturation">0</span></label>
          <input type="range" id="sl-saturation" min="-100" max="100" value="0" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Hue: <span id="val-hue">0</span>°</label>
          <input type="range" id="sl-hue" min="0" max="360" value="0" />
        </div>
      </div>

      <div class="ie-section-label">Filters</div>
      <div class="ie-section">
        <div class="ie-filter-grid">
          <button class="ie-filter-btn active" data-filter="none">None</button>
          <button class="ie-filter-btn" data-filter="grayscale">Grayscale</button>
          <button class="ie-filter-btn" data-filter="sepia">Sepia</button>
          <button class="ie-filter-btn" data-filter="invert">Invert</button>
          <button class="ie-filter-btn" data-filter="blur">Blur</button>
          <button class="ie-filter-btn" data-filter="warm">Warm</button>
        </div>
      </div>

      <div class="ie-section-label">Transform</div>
      <div class="ie-section">
        <div class="ie-transform-row">
          <button class="ie-transform-btn" id="btn-rotate-cw" title="Rotate 90° clockwise">↻ 90°</button>
          <button class="ie-transform-btn" id="btn-rotate-ccw" title="Rotate 90° counter-clockwise">↺ 90°</button>
          <button class="ie-transform-btn" id="btn-flip-h" title="Flip horizontal">⇔ Flip H</button>
          <button class="ie-transform-btn" id="btn-flip-v" title="Flip vertical">⇕ Flip V</button>
        </div>
      </div>

      <div class="ie-section-label">Resize</div>
      <div class="ie-section">
        <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Original: <span id="original-size">–</span></p>
        <div class="ie-resize-row">
          <div class="form-group"><label style="font-size:11px">Width</label><input type="number" id="inp-width" min="1" placeholder="px" /></div>
          <button class="ie-lock-btn locked" id="btn-lock-ratio" title="Lock aspect ratio">🔒</button>
          <div class="form-group"><label style="font-size:11px">Height</label><input type="number" id="inp-height" min="1" placeholder="px" /></div>
        </div>
        <button class="btn btn-ghost btn-xs btn-full" id="btn-apply-resize" style="margin-top:8px">Apply Resize</button>
      </div>

      <div class="ie-section-label">Export</div>
      <div class="ie-section">
        <div class="form-group" style="margin-bottom:8px">
          <label style="font-size:11px">Format</label>
          <div class="ie-export-row">
            <select id="sel-format">
              <option value="image/png">PNG (lossless)</option>
              <option value="image/jpeg" selected>JPG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
        </div>
        <div class="form-group" id="quality-group">
          <label>Quality: <span id="val-quality">90</span>%</label>
          <input type="range" id="sl-quality" min="10" max="100" value="90" />
        </div>
        <button class="ie-reset-btn" id="btn-reset" style="margin-top:4px">Reset all edits</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var state = {
    originalImg: null,
    brightness: 0,
    contrast: 0,
    saturation: 0,
    hue: 0,
    filter: 'none',
    rotation: 0,    // in 90° increments
    flipH: false,
    flipV: false,
    outputWidth: 0,
    outputHeight: 0,
    aspectRatio: 1,
    lockRatio: true
  };

  var canvas = document.getElementById('main-canvas');
  var ctx = canvas.getContext('2d');

  // ── Loading ─────────────────────────────────

  function loadImage(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        state.originalImg = img;
        state.outputWidth = img.naturalWidth;
        state.outputHeight = img.naturalHeight;
        state.aspectRatio = img.naturalWidth / img.naturalHeight;
        document.getElementById('original-size').textContent = img.naturalWidth + ' × ' + img.naturalHeight + 'px';
        document.getElementById('inp-width').value = img.naturalWidth;
        document.getElementById('inp-height').value = img.naturalHeight;
        resetSliders();
        document.getElementById('upload-screen').classList.add('hidden');
        document.getElementById('editor-screen').classList.remove('hidden');
        document.getElementById('btn-download').disabled = false;
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function resetSliders() {
    ['brightness','contrast','saturation','hue'].forEach(function(k){
      document.getElementById('sl-' + k).value = k === 'hue' ? 0 : 0;
      document.getElementById('val-' + k).textContent = 0;
    });
    state.brightness = state.contrast = state.saturation = state.hue = 0;
    state.rotation = 0; state.flipH = false; state.flipV = false;
    state.filter = 'none';
    document.querySelectorAll('.ie-filter-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.filter === 'none'); });
  }

  // ── Rendering ────────────────────────────────

  function buildFilter() {
    var parts = [];
    var b = state.brightness;
    var c = state.contrast;
    var s = state.saturation;
    var h = state.hue;
    // Map -100..100 to CSS filter values
    parts.push('brightness(' + (1 + b / 100) + ')');
    parts.push('contrast(' + (1 + c / 100) + ')');
    parts.push('saturate(' + (1 + s / 100) + ')');
    parts.push('hue-rotate(' + h + 'deg)');
    // Preset filters
    if (state.filter === 'grayscale') parts.push('grayscale(1)');
    if (state.filter === 'sepia') parts.push('sepia(0.8)');
    if (state.filter === 'invert') parts.push('invert(1)');
    if (state.filter === 'blur') parts.push('blur(2px)');
    if (state.filter === 'warm') parts.push('sepia(0.3) saturate(1.4) hue-rotate(-10deg)');
    return parts.join(' ');
  }

  function render() {
    if (!state.originalImg) return;
    var img = state.originalImg;
    var w = state.outputWidth;
    var h = state.outputHeight;
    var rot = state.rotation;
    // Swap dimensions for 90/270 rotation
    var isRotated90 = rot === 90 || rot === 270;
    canvas.width  = isRotated90 ? h : w;
    canvas.height = isRotated90 ? w : h;

    ctx.save();
    ctx.filter = buildFilter();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(rot * Math.PI / 180);
    if (state.flipH) ctx.scale(-1, 1);
    if (state.flipV) ctx.scale(1, -1);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  // ── Sliders ──────────────────────────────────

  function bindSlider(id, key, display) {
    var sl = document.getElementById('sl-' + id);
    var val = document.getElementById('val-' + (display || id));
    sl.addEventListener('input', function () {
      state[key] = +sl.value;
      val.textContent = sl.value;
      render();
    });
  }
  bindSlider('brightness', 'brightness');
  bindSlider('contrast', 'contrast');
  bindSlider('saturation', 'saturation');
  bindSlider('hue', 'hue');

  // ── Filters ──────────────────────────────────

  document.querySelectorAll('.ie-filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.ie-filter-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.filter = btn.dataset.filter;
      render();
    });
  });

  // ── Transform ────────────────────────────────

  document.getElementById('btn-rotate-cw').addEventListener('click', function () {
    state.rotation = (state.rotation + 90) % 360; render();
  });
  document.getElementById('btn-rotate-ccw').addEventListener('click', function () {
    state.rotation = (state.rotation + 270) % 360; render();
  });
  document.getElementById('btn-flip-h').addEventListener('click', function () {
    state.flipH = !state.flipH; render();
  });
  document.getElementById('btn-flip-v').addEventListener('click', function () {
    state.flipV = !state.flipV; render();
  });

  // ── Resize ───────────────────────────────────

  var lockBtn = document.getElementById('btn-lock-ratio');
  lockBtn.addEventListener('click', function () {
    state.lockRatio = !state.lockRatio;
    lockBtn.classList.toggle('locked', state.lockRatio);
    lockBtn.textContent = state.lockRatio ? '🔒' : '🔓';
  });

  document.getElementById('inp-width').addEventListener('input', function () {
    var w = +this.value;
    state.outputWidth = w;
    if (state.lockRatio && state.originalImg) {
      var h = Math.round(w / state.aspectRatio);
      state.outputHeight = h;
      document.getElementById('inp-height').value = h;
    }
  });
  document.getElementById('inp-height').addEventListener('input', function () {
    var h = +this.value;
    state.outputHeight = h;
    if (state.lockRatio && state.originalImg) {
      var w = Math.round(h * state.aspectRatio);
      state.outputWidth = w;
      document.getElementById('inp-width').value = w;
    }
  });
  document.getElementById('btn-apply-resize').addEventListener('click', render);

  // Quality slider visibility
  var formatSel = document.getElementById('sel-format');
  formatSel.addEventListener('change', function () {
    document.getElementById('quality-group').style.display = formatSel.value === 'image/png' ? 'none' : '';
  });
  document.getElementById('sl-quality').addEventListener('input', function () {
    document.getElementById('val-quality').textContent = this.value;
  });

  // ── Download ─────────────────────────────────

  document.getElementById('btn-download').addEventListener('click', function () {
    if (!state.originalImg) return;
    render();
    var fmt = formatSel.value;
    var quality = +document.getElementById('sl-quality').value / 100;
    var ext = fmt === 'image/jpeg' ? '.jpg' : fmt === 'image/webp' ? '.webp' : '.png';
    canvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'edited' + ext;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }, fmt, quality);
  });

  // ── Reset ────────────────────────────────────

  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!state.originalImg) return;
    state.outputWidth = state.originalImg.naturalWidth;
    state.outputHeight = state.originalImg.naturalHeight;
    document.getElementById('inp-width').value = state.outputWidth;
    document.getElementById('inp-height').value = state.outputHeight;
    resetSliders();
    render();
  });

  // ── New Image ────────────────────────────────

  document.getElementById('btn-new').addEventListener('click', function () {
    document.getElementById('editor-screen').classList.add('hidden');
    document.getElementById('upload-screen').classList.remove('hidden');
    document.getElementById('btn-download').disabled = true;
    state.originalImg = null;
  });

  // ── Upload ───────────────────────────────────

  var dropZone = document.getElementById('drop-zone');
  var fileInput = document.getElementById('file-input');

  dropZone.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { if (fileInput.files[0]) loadImage(fileInput.files[0]); });
  dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault(); dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
  });

  // Load from IndexedDB if redirected from landing page
  (function () {
    var req = indexedDB.open('gifwidgets_image', 1);
    req.onupgradeneeded = function (e) { e.target.result.createObjectStore('files'); };
    req.onsuccess = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('files')) return;
      var tx = db.transaction('files', 'readonly');
      var get = tx.objectStore('files').get('pending');
      get.onsuccess = function () {
        var file = get.result;
        if (!file) return;
        var del = db.transaction('files', 'readwrite');
        del.objectStore('files').delete('pending');
        loadImage(file);
      };
    };
  })();

})();
</script>
</body>
</html>
