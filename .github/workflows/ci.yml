name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"   # 6 AM ET (UTC-5) every day

permissions:
  id-token: write   # OIDC for AWS
  contents: read

jobs:
  # ── Build ──────────────────────────────────────────────
  build:
    name: Build templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Jinja2 templates
        run: |
          docker build -f Dockerfile.build -t gifwidgets-build .
          docker run --rm -v "$PWD:/app" gifwidgets-build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/

  # ── Backend Tests ──────────────────────────────────────
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest boto3 numpy Pillow "moto[dynamodb,s3]>=5,<6" "fastapi>=0.115,<1" "httpx>=0.27,<1"

      - name: Run tests
        run: python -m pytest tests/backend/ -v

  # ── E2E Tests ──────────────────────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install video output verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend/

      - name: Run Playwright tests (Chromium only)
        run: npx playwright test --config=tests/e2e/playwright.config.js --project=chromium
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/

  # ── Deploy Prod ────────────────────────────────────────
  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [build, backend-tests, e2e-tests]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform backend
        run: terraform -chdir=terraform init -input=false

      - name: Deploy backend
        run: ENV=prod ./scripts/deploy-backend.sh

      - name: Deploy frontend
        run: ENV=prod ./scripts/deploy-frontend.sh
